name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Dependency health check
        run: |
          pip check

      - name: Lint
        run: |
          ruff check .

      - name: Format check
        run: |
          ruff format --check .

      - name: Unit tests with coverage
        run: |
          pytest --cov=config --cov=ingest_data --cov=rag_engine --cov-report=term-missing
